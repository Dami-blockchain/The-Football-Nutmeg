[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-football-smart-manager"
version = "0.1.0"
description = "The Football Smart Manager — multi-exchange football prediction betting bot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "The Football Smart Manager" }]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "typer>=0.12",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
# Polymarket live trading (CTF Exchange V2). Optional: the base install and the
# paper-mode bot do not need it; discovery uses Gamma over plain HTTP.
polymarket = [
    "py-clob-client-v2>=1.0.1",
]
# Backend API + Telegram bot + on-chain wallet/balance reads.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "web3>=7.0",
    "python-telegram-bot>=21.0",
]

[project.scripts]
tfsm = "betbot.main:app"
betbot = "betbot.main:app"
tfsm-bot = "betbot.telegram_bot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/betbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

