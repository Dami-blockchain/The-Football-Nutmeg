# Self-built-Elo -> ClubElo name bridge (FALLBACK_SCOPE.md §5a, Fable-corrected).
#
# Keys are CANONICAL ClubElo Club names EXACTLY as they appear in
# data/clubelo_scrape_latest.csv (a test asserts every key exists there).
# Values are the alternative spellings the FREE self-built sources emit —
# schochastics idents (the "(Country)" suffix is stripped before matching),
# football-data.co.uk short names, football-data.org long names — that a
# country-restricted >=2-token fuzzy match would otherwise MISS or mis-map.
#
# Loaded ALONGSIDE config/team_aliases.yaml by the build/seed scripts. The
# bridge is country-restricted and refuses single-shared-token and contested
# matches, so these aliases exist to connect names whose token sets differ
# (Man City <-> Manchester City, Qarabağ <-> Karabakh Agdam, …).
#
# Keep conservative: a bad alias silently prices a CL side off the wrong club.

aliases:
  # --- the concrete failures the review calls out ---
  "Paris SG": ["Paris Saint-Germain", "PSG", "Paris SG"]
  "Man City": ["Manchester City", "Man City"]
  "Man United": ["Manchester United", "Man United", "Man Utd"]
  "Inter": ["Internazionale", "Inter Milan", "Internazionale Milano", "FC Internazionale Milano", "Inter"]
  "Milan": ["AC Milan", "Milan"]
  "Karabakh Agdam": ["Qarabağ", "Qarabag", "Qarabag Agdam", "Karabakh Agdam"]
  "Bodoe Glimt": ["Bodø/Glimt", "Bodo/Glimt", "Bodo Glimt"]
  "Crvena Zvezda": ["Crvena Zvezda", "Red Star Belgrade", "Crvena zvezda"]

  # --- F5: real ClubElo canonicals (phantom keys fixed) ---
