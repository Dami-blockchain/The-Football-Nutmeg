# Self-built-Elo -> ClubElo name bridge (FALLBACK_SCOPE.md §5a).
#
# Keys are the CANONICAL ClubElo Club names (as they appear in
# data/clubelo_scrape_latest.csv — the candidate pool the build-time bridge
# resolves against). Values are the alternative spellings the FREE self-built
# sources use (schochastics "Name (Country)" idents, football-data.co.uk short
# names, openfootball long names) that a fuzzy-only matcher gets WRONG.
#
# Loaded ALONGSIDE config/team_aliases.yaml into one TeamAliasResolver by the
# build/seed scripts, so resolution is: exact alias FIRST, then exact-
# normalised, then fuzzy >=0.70, and ambiguous >=0.90 multi-hits are REFUSED
# (left unresolved -> that club drops to naive) rather than mis-mapped.
#
# Keep conservative: a bad alias silently prices a CL side off the wrong club.
# Hand-corrected from the residual misses the Task A anchor bridge exposed.

aliases:
  # --- the concrete failures §5a calls out ---
  "Paris SG": ["Paris Saint-Germain", "Paris Saint-Germain FC", "PSG", "Paris SG"]
  "Man City": ["Manchester City", "Manchester City FC", "Man City"]
  "Man United": ["Manchester United", "Manchester United FC", "Man Utd", "Man United"]
  "Inter": ["Internazionale", "Internazionale Milano", "Inter Milan", "FC Internazionale Milano"]
  "Milan": ["AC Milan", "Milan AC", "Associazione Calcio Milan"]
