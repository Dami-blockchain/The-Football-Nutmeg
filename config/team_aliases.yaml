# Manual team-name overrides for matching football-data.org names to
# prediction-market titles (Polymarket / Limitless).
#
# Keys are the canonical football-data.org team names (as returned by the
# API). Values are alternative spellings a market might use. Matching is done
# on a diacritic-stripped, noise-token-stripped, lowercased form, so you only
# need entries here for cases fuzzy matching gets WRONG — abbreviations and
# nicknames the markets favour. Regenerate/extend with:
#     tfsm ... scripts/seed_aliases.py   (Phase 2)
#
# Keep this list conservative: a bad alias silently mis-routes a bet.

aliases:
  "RCD Espanyol de Barcelona": ["Espanol", "Espanyol", "Espanyol Barcelona"]
  "Royale Union Saint-Gilloise": ["St Gillis", "Union SG", "Union Saint-Gilloise", "USG"]
  "Paris Saint-Germain FC": ["PSG", "Paris SG", "Paris Saint Germain"]
  "FC Bayern München": ["Bayern Munich", "Bayern", "Bayern Munchen"]
  "Borussia Dortmund": ["Dortmund", "BVB"]
  "Borussia Mönchengladbach": ["Gladbach", "Monchengladbach", "Borussia M'gladbach", "M'gladbach"]
  "Hamburger SV": ["Hamburg", "Hamburger SV"]
  "Manchester City FC": ["Man City", "Manchester City"]
  "Manchester United FC": ["Man United", "Man Utd", "Manchester United"]
  "Tottenham Hotspur FC": ["Tottenham", "Spurs"]
  "Wolverhampton Wanderers FC": ["Wolves", "Wolverhampton"]
  "Brighton & Hove Albion FC": ["Brighton", "Brighton Hove Albion"]
  "Newcastle United FC": ["Newcastle", "Newcastle Utd"]
  "West Ham United FC": ["West Ham", "West Ham Utd"]
  "Nottingham Forest FC": ["Nottingham Forest", "Notts Forest", "Forest", "Nott'm Forest"]
  "Club Atlético de Madrid": ["Atletico Madrid", "Atletico", "Atleti", "Ath Madrid"]
  "Real Madrid CF": ["Real Madrid", "Madrid"]
  "FC Barcelona": ["Barcelona", "Barca"]
  "Real Sociedad de Fútbol": ["Real Sociedad", "La Real"]
  "Athletic Club": ["Athletic Bilbao", "Athletic", "Bilbao", "Ath Bilbao"]
  "Real Betis Balompié": ["Real Betis", "Betis"]
  "RC Celta de Vigo": ["Celta Vigo", "Celta"]
  "Internazionale Milano FC": ["Inter Milan", "Inter", "Internazionale"]
  "AC Milan": ["Milan", "AC Milan"]
  "SSC Napoli": ["Napoli"]
  "AS Roma": ["Roma"]
  "Juventus FC": ["Juventus", "Juve"]
  "Olympique de Marseille": ["Marseille", "OM"]
  "Olympique Lyonnais": ["Lyon", "OL"]
  "Stade Brestois 29": ["Brest", "Stade Brestois"]
  "Stade Rennais FC 1901": ["Rennes", "Stade Rennais", "Rennais"]

  # ---- Portuguese clubs sharing the "sporting" token ----------------------
  # ClubElo lists Sporting CP and Braga as the short names "Sporting" and
  # "Braga", but CL results / football-data.org use "Sporting Clube de
  # Portugal" and "Sporting Clube de Braga". Both normalise to a token set
  # containing "sporting", so the fuzzy matcher ties them 100/100 — and the
  # tie-guard would then return None, dropping the fixture to the naive
  # engine. Fold each long name to its ClubElo short name so it resolves as
  # an exact hit (deterministic, independent of pool order). Six historical
  # CL matches were priced off Sporting CP's rating instead of Braga's.
  "Braga": ["Sporting Braga", "Sporting Clube de Braga", "SC Braga"]
  "Sporting": ["Sporting CP", "Sporting Clube de Portugal", "Sporting Lisbon", "Sporting Portugal"]

  # ---- National teams (World Cup 2026) -----------------------------------
  # Markets and football-data.org disagree on national-team naming far more
  # than on clubs (Korea Republic vs South Korea, Türkiye vs Turkey, …). These
  # are NOT cosmetic — without them the matcher pairs the right fixture to the
  # WRONG market or no market at all. Keep entries to genuine name variants of
  # the SAME nation (never two different nations).
  "Korea Republic": ["South Korea", "Korea", "KOR", "Republic of Korea"]
  "Korea DPR": ["North Korea", "DPR Korea", "PRK"]
  "Türkiye": ["Turkey", "Turkiye"]
  "United States": ["USA", "US", "United States of America", "USMNT"]
  "Czechia": ["Czech Republic", "Czechoslovakia", "CZE"]
  "IR Iran": ["Iran", "Islamic Republic of Iran"]
  "Côte d'Ivoire": ["Ivory Coast", "Cote d'Ivoire"]
  "China PR": ["China"]
  "Cabo Verde": ["Cape Verde"]
  # football-data.org names these differently from the results dataset; the
  # canonical key here is the football-data spelling the engine queries by.
  "Cape Verde Islands": ["Cape Verde", "Cabo Verde", "CPV"]
  "Congo DR": ["DR Congo", "Democratic Republic of the Congo", "DR Congo", "Congo-Kinshasa", "COD"]
  "Bosnia-Herzegovina": ["Bosnia and Herzegovina", "Bosnia", "BIH"]
  "South Africa": ["RSA", "Bafana Bafana"]
  "Mexico": ["MEX", "El Tri"]
