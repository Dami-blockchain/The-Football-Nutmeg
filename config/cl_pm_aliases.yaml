# CL-specific team-name overlay for the Polymarket per-match anchor
# (betbot.exchanges.polymarket_cl_odds). MERGED on top of config/team_aliases.yaml
# — only add CL entrants that team_aliases.yaml does not already cover, or whose
# Polymarket spelling differs. Keys are the canonical name; values are the
# alternative spellings football-data.org OR Polymarket titles may use.
#
# Seeded (2026-10-15) from the research alias tables in
# ~/research/cl-knockouts-2026-10-12/scripts/anchor_ko.py and
# ~/research/cl-anchor-bestcase-2026-10-14/scripts/analyze.py, which were
# validated against 480 priced CL events. The matcher's exact-alias-first +
# ambiguous-tie rejection (betbot.exchanges.matcher.TeamAliasResolver) is what
# stops PSG->"Paris FC" and "Athletic Club"->"Atletico"; these entries feed the
# exact pass so those collisions never reach the fuzzy fallback.
aliases:
  # --- clubs outside the big-5 domestic alias table ---
  "FK Bodo/Glimt": ["Bodo Glimt", "Bodo/Glimt", "Bodoe Glimt", "Bod Glimt"]
  "Sporting CP": ["Sporting", "Sporting Lisbon", "Sporting Clube de Portugal"]
