# The Football Smart Manager - nginx reverse proxy.
# Put this at /etc/nginx/sites-available/tfsm and symlink into sites-enabled.
# Replace SERVER_NAME with your domain, then run certbot for HTTPS:
#   sudo certbot --nginx -d your.domain
#
# uvicorn (127.0.0.1:8000) serves BOTH the API and the built dashboard, so we
# simply proxy everything to it. The API requires a bearer token when
# TFSM_API_TOKEN is set in .env — set one before exposing this publicly.

server {
    listen 80;
    server_name SERVER_NAME;

    # Telegram + on-chain reads can be slow; give the proxied app room.
    proxy_read_timeout 60s;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
